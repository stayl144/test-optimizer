name: oidc-debug
on:
  push:
    branches: [oidc-debug]
permissions:
  contents: read
  id-token: write
jobs:
  show:
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Show what GitHub sends to AWS
        run: |
          TOKEN=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
          python3 -c "import sys,json,base64;p=sys.argv[1].split('.')[1];p+='='*(-len(p)%4);c=json.loads(base64.urlsafe_b64decode(p));print(json.dumps({k:c.get(k) for k in ['sub','aud','repository','environment']},indent=2))" "$TOKEN"
      - name: Try the dev role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1